<!DOCTYPE html>
<html lang="es">
<!--
  PRISMA+ v5.2 adaptado a QPU-00 — Vanilla JS ES2022+
  Runtime: NO frameworks (R1)

  ⚠️ ESTO ES SOLO UNA REFERENCIA VISUAL ESTÁTICA.
  El QPU-01 real debe GENERAR este formulario dinámicamente
  a partir de un archivo .clinical, no hardcodearlo.

  Útil para:
  - Validar el "look & feel" esperado
  - Tener un smoke test visual rápido
  - Referencia de cómo mapear tipos de variable → input HTML
-->
<head>
    <meta charset="UTF-8">
    <title>QPU-01 — Referencia visual (NO implementación)</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: #c00; font-size: 0.9em; margin-top: 4px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Formulario de Crecimiento Pediátrico</h1>
    <p><small>Renderizado estático de referencia. La versión dinámica de QPU-01 lee <code>examples/ejemplo-basico.clinical</code> y produce este mismo formulario.</small></p>

    <form id="clinicalForm">
        <div class="form-group">
            <label for="edad">Edad (años):</label>
            <input type="number" id="edad" name="edad" min="0" max="18" step="1" required>
            <div class="error" id="edadError"></div>
        </div>

        <div class="form-group">
            <label for="sexo">Sexo:</label>
            <select id="sexo" name="sexo" required>
                <option value="">Seleccione...</option>
                <option value="m">Masculino</option>
                <option value="f">Femenino</option>
            </select>
            <div class="error" id="sexoError"></div>
        </div>

        <div class="form-group">
            <label for="altura">Altura (cm):</label>
            <input type="number" id="altura" name="altura" min="50" max="180" step="any" required>
            <div class="error" id="alturaError"></div>
        </div>

        <div class="form-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" name="peso" min="2" max="50" step="any" required>
            <div class="error" id="pesoError"></div>
        </div>

        <div class="form-group">
            <label for="categoria_bmi">Categoría BMI:</label>
            <select id="categoria_bmi" name="categoria_bmi" required>
                <option value="">Seleccione...</option>
                <option value="bajo">Bajo peso</option>
                <option value="normal">Peso normal</option>
                <option value="sobre">Sobrepeso</option>
                <option value="obesidad">Obesidad</option>
            </select>
            <div class="error" id="categoria_bmiError"></div>
        </div>

        <div class="form-group">
            <label for="nivel_severidad">Nivel de severidad:</label>
            <select id="nivel_severidad" name="nivel_severidad" required>
                <option value="">Seleccione...</option>
                <option value="leve">Leve</option>
                <option value="moderado">Moderado</option>
                <option value="severo">Severo</option>
            </select>
            <div class="error" id="nivel_severidadError"></div>
        </div>

        <button type="submit">Guardar</button>
    </form>

    <script>
        // Esta validación es referencial. La implementación real la extrae del .clinical.
        const form = document.getElementById('clinicalForm');
        const fields = ['edad', 'sexo', 'altura', 'peso', 'categoria_bmi', 'nivel_severidad'];
        const errors = Object.fromEntries(fields.map(f => [f, document.getElementById(f + 'Error')]));

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            let isValid = true;
            fields.forEach(f => errors[f].textContent = '');

            const edad = parseInt(document.getElementById('edad').value);
            if (isNaN(edad) || edad < 0 || edad > 18) {
                errors.edad.textContent = 'Edad debe estar entre 0 y 18 años';
                isValid = false;
            }

            const sexo = document.getElementById('sexo').value;
            if (!sexo) { errors.sexo.textContent = 'Seleccione un sexo'; isValid = false; }

            const altura = parseFloat(document.getElementById('altura').value);
            if (isNaN(altura) || altura < 50 || altura > 180) {
                errors.altura.textContent = 'Altura debe estar entre 50 y 180 cm';
                isValid = false;
            }

            const peso = parseFloat(document.getElementById('peso').value);
            if (isNaN(peso) || peso < 2 || peso > 50) {
                errors.peso.textContent = 'Peso debe estar entre 2 y 50 kg';
                isValid = false;
            }

            if (isValid) {
                alert('Formulario válido (modo referencia). La versión real exporta JSON/CSV.');
            }
        });
    </script>
</body>
</html>
